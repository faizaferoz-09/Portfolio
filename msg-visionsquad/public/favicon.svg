<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient — Dark Warm Obsidian -->
    <radialGradient id="favBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1f0902" />
      <stop offset="65%" stop-color="#0c0301" />
      <stop offset="100%" stop-color="#050100" />
    </radialGradient>

    <!-- F Emblem Gradient — Fiery Orange to Golden Amber -->
    <linearGradient id="favFGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="40%" stop-color="#ff4d2d" />
      <stop offset="75%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <!-- Fiery Orbit Ring Gradient -->
    <linearGradient id="favOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b00" />
      <stop offset="45%" stop-color="#ff7700" />
      <stop offset="80%" stop-color="#ffbb00" />
      <stop offset="100%" stop-color="#ff4d2d" />
    </linearGradient>

    <!-- Fiery Outer Glow Filter -->
    <filter id="orangeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#favBg)" stroke="#ff4d2d" stroke-width="2" stroke-opacity="0.5" />

  <!-- Back Half of Fiery Planetary Orbital Ring -->
  <ellipse cx="60" cy="58" rx="44" ry="16" fill="none" stroke="url(#favOrbitGrad)" stroke-width="3" transform="rotate(-18 60 58)" opacity="0.65" stroke-dasharray="140 140" stroke-dashoffset="130" />

  <!-- Stylized Italic "F" Emblem in Fiery Theme Colors -->
  <g transform="skewX(-14) translate(14, 0)">
    <path d="M 44 26 C 44 23 46.5 21 50 21 L 82 C 86.5 21 88 24 85 28 L 78 37 C 76.5 39 74 40 71 40 L 53 40 L 48 53 L 67 53 C 70.5 53 72 55.5 70 58.5 L 65.5 65 C 64 67 62 68 59 68 L 42 68 L 28 95 C 26.5 98 23.5 99 20 99 L 14 99 C 10.5 99 10 96 12 92 Z" 
          fill="url(#favFGrad)" 
          filter="url(#orangeGlow)" />
  </g>

  <!-- Front Half of Fiery Planetary Orbital Ring -->
  <ellipse cx="60" cy="58" rx="44" ry="16" fill="none" stroke="url(#favOrbitGrad)" stroke-width="3.8" transform="rotate(-18 60 58)" stroke-dasharray="140 140" stroke-dashoffset="0" filter="url(#orangeGlow)" />

  <!-- Sparkle Four-Point Stars in Bright Amber and White -->
  <path d="M 88 38 Q 91 38 91 35 Q 91 38 94 38 Q 91 38 91 41 Q 91 38 88 38 Z" fill="#ffffff" filter="url(#orangeGlow)" />
  <path d="M 32 46 Q 34 46 34 44 Q 34 46 36 46 Q 34 46 34 48 Q 34 46 32 46 Z" fill="#ffbb00" />
</svg>