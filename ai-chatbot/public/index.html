<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional AI Assistant chatbot powered by Google Gemini" />
  <title>AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Chat navigation">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3.5c.8 2.4 2.1 3.7 4.5 4.5-2.4.8-3.7 2.1-4.5 4.5-.8-2.4-2.1-3.7-4.5-4.5 2.4-.8 3.7-2.1 4.5-4.5Z"
              fill="currentColor" />
            <circle cx="6" cy="17" r="1.4" fill="currentColor" />
            <circle cx="18.5" cy="7.5" r="1" fill="currentColor" />
          </svg>
        </div>
        <div>
          <p class="brand-title">AI Assistant</p>
          <p class="brand-subtitle">Gemini-powered chat</p>
        </div>
      </div>

      <button class="btn btn-primary new-chat-btn" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        New Chat
      </button>

      <div class="sidebar-section">
        <div class="section-heading">
          <h2>Chat history</h2>
          <button class="text-btn" id="clearHistoryBtn" type="button">Clear history</button>
        </div>
        <nav class="history-list" id="historyList" aria-label="Previous chats"></nav>
      </div>

      <p class="sidebar-footnote">History is kept for this browser session only.</p>
    </aside>

    <div class="main">
      <header class="chat-header">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar"
          aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" />
          </svg>
        </button>

        <div class="header-identity">
          <div class="avatar ai-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 3.5c.8 2.4 2.1 3.7 4.5 4.5-2.4.8-3.7 2.1-4.5 4.5-.8-2.4-2.1-3.7-4.5-4.5 2.4-.8 3.7-2.1 4.5-4.5Z"
                fill="currentColor" />
            </svg>
          </div>
          <div>
            <h1>AI Assistant</h1>
            <p class="status"><span class="status-dot" aria-hidden="true"></span> Online</p>
          </div>
        </div>

        <button class="btn btn-ghost" id="clearChatBtn" type="button">Clear Chat</button>
      </header>

      <main class="chat-panel" id="chatPanel">
        <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

        <section class="welcome" id="welcomeScreen">
          <div class="welcome-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 3.5c.8 2.4 2.1 3.7 4.5 4.5-2.4.8-3.7 2.1-4.5 4.5-.8-2.4-2.1-3.7-4.5-4.5 2.4-.8 3.7-2.1 4.5-4.5Z"
                fill="currentColor" />
            </svg>
          </div>
          <h2>Hello! I'm your AI Assistant.</h2>
          <p>How can I help you today?</p>
          <div class="prompt-grid" id="promptGrid">
            <button class="prompt-card" type="button" data-prompt="Explain JavaScript in simple words.">
              <span class="prompt-label">Explain something</span>
              <span class="prompt-example">Explain JavaScript in simple words.</span>
            </button>
            <button class="prompt-card" type="button" data-prompt="What is HTML?">
              <span class="prompt-label">What is HTML?</span>
              <span class="prompt-example">Ask Gemini to explain HTML</span>
            </button>
            <button class="prompt-card" type="button" data-prompt="Write a JavaScript function to reverse a string.">
              <span class="prompt-label">Write code</span>
              <span class="prompt-example">Reverse a string in JavaScript</span>
            </button>
            <button class="prompt-card" type="button" data-prompt="Help me understand loops.">
              <span class="prompt-label">Help me study</span>
              <span class="prompt-example">Help me understand loops.</span>
            </button>
          </div>
        </section>
      </main>

      <form class="composer" id="chatForm">
        <label class="sr-only" for="messageInput">Message</label>
        <textarea id="messageInput" name="message" rows="1" placeholder="Ask anything…" maxlength="8000"
          autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
